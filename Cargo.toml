[workspace]
resolver = "2"
members = [
    "crates/pos-core",
    "crates/pos-store",
    "crates/pos-hardware",
    "crates/pos-ui",
    "apps/pos",
    "apps/pos-import",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.80"
authors = ["POSrust"]

[workspace.dependencies]
rust_decimal = { version = "1", features = ["maths"] }
thiserror = "2"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
